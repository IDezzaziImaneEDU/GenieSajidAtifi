<title>Les Animaux — Petit Génie</title>

.top{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px auto;max-width:1100px}

.count{font-weight:800;color:#1477a8} .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{min-width:0;position:relative;border:2px solid #c2e8f3;border-radius:16px;background:linear-gradient(145deg,#fff,#f0fbff);padding:7px 6px 10px;text-align:center;box-shadow:0 3px 0 #d6eef3;transition:transform .15s,border-color .15s}

.section{margin:26px 0 12px;background:#fff;border:2px solid #bce8f5;border-radius:20px;padding:18px;box-shadow:0 4px 0 #d8f1f7}
.section h2{margin:0 0 8px;color:#087fc0} .game-options{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}

@media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))} .card img{height:90px}}

  <div class="tag" data-i18n="tag">Apprendre en s’amusant !</div>
  <nav class="top lang" aria-label="Choisir la langue">

  </nav>
  <div class="hero"><h1 data-i18n="title">🐾 Les Animaux 🐾</h1><p data-i18n="subtitle">Écoute, découvre et apprends !</p><p data-i18n="hint">Clique sur un animal pour écouter son nom et son cri ! 🔊</p></div>
</header>

    <div class="game-options" id="options"></div>
    <p id="feedback" role="status"></p>
    <div style="text-align:center"><button id="nextBtn" class="primary" data-i18n="next">➡️ Question suivante</button> <span id="score">⭐ 0 / 0</span></div>

</main>
<footer data-i18n="footer">Petit Génie — J’apprends, je joue, je grandis ! 🌈</footer>

function label(a){return a[lang]}
function speak(text){if(!("speechSynthesis" in window)){alert("Speech synthesis is not supported in this browser.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang={fr:"fr-FR",en:"en-GB",ar:"ar-SA"}[lang];u.rate=.85;speechSynthesis.speak(u)}
